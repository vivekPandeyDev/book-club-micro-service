jwt:
  open-id-security-name: keycloak
  open-id-uri: http://${OPEN_ID_HOST}:9090/realms/auth-server/.well-known/openid-configuration
auth:
  keycloak:
    config:
      client-id: ${KEYCLOAK_CLIENT_ID}
      default-role: user
      realm: ${KEYCLOAK_REALM}
      base-url: ${KEYCLOAK_DOMAIN}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
      admin-client-secret: ${KEYCLOAK_CLIENT_SECRET}
server:
  port: 4003

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  #  kafka consumer
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: oauth-user-group-1
  datasource:
    url: jdbc:postgresql://localhost:5436/user-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: HikariPool-19
  #       form data enable
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
#      application name
  application:
    name: user-service
  #    update config at last
  config:
    import: configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8083}